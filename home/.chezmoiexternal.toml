# oh-my-zsh and its custom plugins, cloned on first `chezmoi apply` and pulled
# again once refreshPeriod has elapsed (or force with `chezmoi update -R`).

[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]
    pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-completions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-completions.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
