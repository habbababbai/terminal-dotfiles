filetype: ghostty

detect:
    filename: "ghostty/(config|.*\\.conf)(\\.tmpl)?$|\\.ghostty$"
    header: "^#.*[Gg]hostty"

rules:
    # Keys: the identifier at the start of a line, before the '='
    - identifier: "^[[:space:]]*[a-zA-Z][a-zA-Z0-9_-]*"

    # Booleans and common enum-ish literals
    - constant.bool: "\\b(true|false)\\b"

    # Hex colours (#rgb / #rrggbb) and plain numbers
    - constant.number: "#[0-9a-fA-F]{3,8}\\b"
    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"

    # Quoted strings
    - constant.string:
        start: "\""
        end: "\""
        rules:
            - constant.specialChar: "\\\\."

    # The '?' prefix that makes config-file includes optional
    - special: "=[[:space:]]*\\?"

    # Modifier keys inside keybind = ... values
    - statement: "\\b(ctrl|control|shift|alt|opt|option|cmd|command|super|globa|physical|unconsumed|all|performable)\\b"

    # Separators
    - symbol.operator: "[=+>]"

    # Comments win over everything above
    - comment:
        start: "#"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX|NOTE):?"

    - indent-char.whitespace: "[[:space:]]+$"
