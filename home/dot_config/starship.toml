"$schema" = 'https://starship.rs/config-schema.json'

# Tokyo Night preset (https://starship.rs/presets/tokyo-night), recolored to
# match the live Ghostty theme (~/.config/ghostty/themes/GitHub-Dark)
# instead of the preset's own blue palette. Structure/format left untouched;
# only hex values changed:
#   #a3aed2 -> #c9d1d9  (cursor-color - light neutral, os segment)
#   #090c0c -> #101216  (background   - near-black text on light bg)
#   #769ff0 -> #6ca4f8  (ansi blue    - accent)
#   #e3e5e5 -> #101216  (background   - dark text on accent bg, 7.4:1)
#   (git text)  #ffffff  (ansi white   - text on git segment, 8.2:1)
#   #394260 -> #3b5070  (selection-bg - blue-grey, git segment)
#   #212736 -> #30363d  (GitHub UI border - darker, lang segment)
#   #1d2230 -> #101216  (background   - darkest, time segment)
#   #a0a9cb -> #8b949e  (foreground   - muted text, time segment)

format = """
[░▒▓](#c9d1d9)\
$os\
[](bg:#6ca4f8 fg:#c9d1d9)\
$directory\
[](fg:#6ca4f8 bg:#3b5070)\
$git_branch\
$git_status\
[](fg:#3b5070 bg:#30363d)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#30363d bg:#101216)\
$time\
[ ](fg:#101216)\
\n$character"""

[directory]
style = "fg:#101216 bg:#6ca4f8"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3b5070"
format = '[[ $symbol $branch ](fg:#ffffff bg:#3b5070)]($style)'

[git_status]
style = "bg:#3b5070"
format = '[[($all_status$ahead_behind )](fg:#ffffff bg:#3b5070)]($style)'

[nodejs]
symbol = ""
style = "bg:#30363d"
format = '[[ $symbol ($version) ](fg:#6ca4f8 bg:#30363d)]($style)'

[bun]
symbol = ""
style = "bg:#30363d"
format = '[[ $symbol ($version) ](fg:#6ca4f8 bg:#30363d)]($style)'

[rust]
symbol = ""
style = "bg:#30363d"
format = '[[ $symbol ($version) ](fg:#6ca4f8 bg:#30363d)]($style)'

[golang]
symbol = ""
style = "bg:#30363d"
format = '[[ $symbol ($version) ](fg:#6ca4f8 bg:#30363d)]($style)'

[php]
symbol = ""
style = "bg:#30363d"
format = '[[ $symbol ($version) ](fg:#6ca4f8 bg:#30363d)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#101216"
format = '[[  $time ](fg:#8b949e bg:#101216)]($style)'

[os]
style = "bg:#c9d1d9 fg:#101216"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
